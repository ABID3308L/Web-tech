
<!DOCTYPE html>
<html>
<head>

    <style>
        {
            position: relative;
            width: 700px;
            height: 350px;
            border: 2px solid black;

            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }

        .box {
            position: absolute;
            width: 150px;
            height: 150px;
            border: 5px solid #8B2635;
        }

        .box1 {
            left: 20px;
            top: 20px;
        }

        .box2 {
            left: 220px;
            top: 20px;
        }

        .box3 {
            left: 420px;
            top: 20px;
        }
    </style>
</head>

<body>

        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
    </div>

</body>
</html>
